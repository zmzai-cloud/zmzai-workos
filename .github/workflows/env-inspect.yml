name: env-inspect

# 一次性诊断：探测 HK 服务器受限 CLI 的可用命令（usage 输出），为补齐 env 定路径。
# 手动触发，不参与常规部署。

"on":
  workflow_dispatch: {}

env:
  HK_HOST: 149.88.84.189
  HK_USER: root

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe CLI usage
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HK_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          SSH="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new ${HK_USER}@${HK_HOST}"
          echo "=== probe: envget (no args) ==="
          $SSH "envget" 2>&1 | head -20 || true
          echo "=== probe: deploy-targets hint (bad tool) ==="
          $SSH "zzz-probe" 2>&1 | head -20 || true
          echo "=== probe: envset exists? ==="
          $SSH "envset" 2>&1 | head -20 || true
